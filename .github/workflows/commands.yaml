name: Commands
permissions:
  contents: read
"on":
  issue_comment:
    types:
      - created
jobs:
  backport:
    if: github.event.issue.pull_request != null && contains(github.event.comment.body, '.backport')
    runs-on: ubuntu-slim
    steps:
      - id: createGithubAppToken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: shikanime-labs/actions/nix/setup@786e049058c1f4edfdba59fbb2ef7c504861f462 # v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
      - uses: shikanime-labs/actions/command/backport@786e049058c1f4edfdba59fbb2ef7c504861f462 # v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          sign-commits: true
  close:
    if: github.event.issue.pull_request != null && contains(github.event.comment.body, '.close')
    runs-on: ubuntu-slim
    steps:
      - id: createGithubAppToken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: shikanime-labs/actions/nix/setup@786e049058c1f4edfdba59fbb2ef7c504861f462 # v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
      - uses: shikanime-labs/actions/command/close@786e049058c1f4edfdba59fbb2ef7c504861f462 # v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
          username: yorha-automata
  land:
    if: github.event.issue.pull_request != null && (contains(github.event.comment.body, '.land') || contains(github.event.comment.body, '.force-land'))
    runs-on: ubuntu-slim
    steps:
      - id: createGithubAppToken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
          permission-administration: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: shikanime-labs/actions/nix/setup@786e049058c1f4edfdba59fbb2ef7c504861f462 # v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
      - uses: shikanime-labs/actions/command/land@786e049058c1f4edfdba59fbb2ef7c504861f462 # v9
        with:
          email: automata@shikanime.studio
          fullname: Automata
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          sign-commits: true
          username: yorha-automata
  rebase:
    if: github.event.issue.pull_request != null && contains(github.event.comment.body, '.rebase')
    runs-on: ubuntu-slim
    steps:
      - id: createGithubAppToken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: shikanime-labs/actions/nix/setup@786e049058c1f4edfdba59fbb2ef7c504861f462 # v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
      - uses: shikanime-labs/actions/command/rebase@786e049058c1f4edfdba59fbb2ef7c504861f462 # v9
        with:
          email: automata@shikanime.studio
          fullname: Automata
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          sign-commits: true
          username: yorha-automata
  run:
    if: github.event.issue.pull_request != null && contains(github.event.comment.body, '.run')
    runs-on: ubuntu-slim
    steps:
      - id: createGithubAppToken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: shikanime-labs/actions/nix/setup@786e049058c1f4edfdba59fbb2ef7c504861f462 # v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
      - uses: shikanime-labs/actions/command/run@786e049058c1f4edfdba59fbb2ef7c504861f462 # v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
