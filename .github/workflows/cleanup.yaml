name: Cleanup
permissions:
  contents: read
"on":
  pull_request:
    types:
      - closed
jobs:
  cleanup:
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-slim
    steps:
      - id: createGithubAppToken
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
          permission-contents: write
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: shikanime-labs/actions/nix/setup@a91a9b57c78121e303aa30aea2d8ed2ee03ff45f # v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
      - uses: shikanime-labs/actions/cleanup@a91a9b57c78121e303aa30aea2d8ed2ee03ff45f # v9
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
          pull-request-url: ${{ github.event.pull_request.html_url }}
